name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: python app_test.py

    - name: Build image
      run: docker build -t scalable-project-app:1.0 .

    - name: Run container in background
      run: docker run -d -p 8080:8080 --name test_app scalable-project-app:1.0

    - name: Test container
      run: |
        sleep 5
        curl --fail http://localhost:8080/ || (docker logs test_app && exit 1)
      
    - name: Stop and remove container
      if: always()
      run: docker rm -f test_app

    - name: Start Minikube
      uses: medyagh/setup-minikube@latest

    - name: Load Docker image to Minikube
      run: |
        minikube image load scalable-project-app:1.0

    - name: Deploy to test environment
      run: |
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml

    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/scalable-project-deployment
        kubectl get pods

    - name: Test deployed application
      run: |
        kubectl port-forward service/scalable-project-service 8080:8080 &
        sleep 5
        curl --fail http://localhost:8080/

    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Tag and Push to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag scalable-project-app:1.0 ${{ secrets.DOCKERHUB_USERNAME }}/scalable-project-app:latest
        docker tag scalable-project-app:1.0 ${{ secrets.DOCKERHUB_USERNAME }}/scalable-project-app:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/scalable-project-app:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/scalable-project-app:${{ github.sha }}