apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: scalable-project-app
  namespace: flux-system
spec:
  image: vic20253/scalable-project-app
  interval: 1m0s
  secretRef:
    name: dockerhub-credentials
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: scalable-project-app
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: scalable-project-app
  policy:
    semver:
      range: '>=1.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: scalable-project-app
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: '[ci skip] Update image tags'
    push:
      branch: main
  update:
    path: ./
    strategy: Setters